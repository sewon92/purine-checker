<meta name="apple-mobile-web-app-title" content="퓨린 체커">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #F0F4F8;
    --white: #FFFFFF;
    --text: #1A2535;
    --text2: #4A5568;
    --text3: #8A9BB0;
    --border: #DDE3EC;
    --primary: #4F86C6;
    --primary-light: #EBF3FF;
    --red: #E53E3E; --red-bg: #FFF5F5; --red-border: #FED7D7;
    --orange: #C05621; --orange-bg: #FFFAF0; --orange-border: #FEEBC8;
    --yellow: #975A16; --yellow-bg: #FFFFF0; --yellow-border: #FEFCBF;
    --green: #276749; --green-bg: #F0FFF4; --green-border: #C6F6D5;
    --shadow: 0 1px 4px rgba(0,0,0,0.08);
    --shadow-md: 0 2px 10px rgba(0,0,0,0.10);
  }
  body {
    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 40px;
  }
  header {
    background: linear-gradient(135deg, #EBF3FF 0%, #E8F4FF 50%, #EDF9F0 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 16px 16px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: var(--shadow);
  }
  .header-top { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 4px; }
  h1 { font-size: 20px; font-weight: 800; background: linear-gradient(90deg, #4F86C6, #38A169); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }
  .subtitle { text-align: center; font-size: 11px; color: var(--text3); margin-bottom: 14px; }
  .search-wrap { display: flex; gap: 8px; max-width: 500px; margin: 0 auto; }
  input[type=text] {
    flex: 1; background: var(--white); border: 1.5px solid var(--border);
    border-radius: 12px; padding: 11px 14px; font-size: 15px;
    font-family: inherit; color: var(--text); outline: none;
    box-shadow: var(--shadow); transition: border-color 0.2s, box-shadow 0.2s;
  }
  input[type=text]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,134,198,0.15); }
  input[type=text]::placeholder { color: var(--text3); }
  .btn-search {
    background: linear-gradient(135deg, #4F86C6, #38A169);
    border: none; border-radius: 12px; padding: 11px 18px;
    color: #fff; font-size: 15px; font-weight: 700;
    font-family: inherit; cursor: pointer; white-space: nowrap;
    box-shadow: 0 2px 8px rgba(79,134,198,0.35);
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn-search:active { transform: scale(0.97); opacity: 0.9; }

  .container { max-width: 500px; margin: 0 auto; padding: 16px; }

  /* Quick tags */
  .section-label { font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 10px; }
  .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; }
  .tag {
    background: var(--white); border: 1px solid var(--border);
    border-radius: 20px; padding: 5px 13px; font-size: 13px;
    color: var(--text2); cursor: pointer; font-family: inherit;
    box-shadow: var(--shadow); transition: all 0.15s;
  }
  .tag:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }

  /* Category tabs */
  .cat-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; -webkit-overflow-scrolling: touch; }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .cat-tab {
    background: var(--white); border: 1px solid var(--border);
    border-radius: 20px; padding: 6px 14px; font-size: 12px; font-weight: 600;
    color: var(--text2); cursor: pointer; font-family: inherit;
    white-space: nowrap; box-shadow: var(--shadow); transition: all 0.15s;
    flex-shrink: 0;
  }
  .cat-tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  /* Legend */
  .legend {
    background: var(--white); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; box-shadow: var(--shadow);
  }
  .legend-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .legend-row:last-child { margin-bottom: 0; }
  .legend-badge { font-size: 12px; font-weight: 700; width: 62px; flex-shrink: 0; }
  .legend-desc { font-size: 11px; color: var(--text3); line-height: 1.4; }

  /* Result */
  .result { animation: fadeUp 0.35s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .result-main {
    border-radius: 18px; padding: 22px; margin-bottom: 10px;
    position: relative; overflow: hidden; box-shadow: var(--shadow-md);
    border: 2px solid transparent;
  }
  .result-main.VERY_HIGH { background: var(--red-bg); border-color: var(--red-border); }
  .result-main.HIGH { background: var(--orange-bg); border-color: var(--orange-border); }
  .result-main.MEDIUM { background: var(--yellow-bg); border-color: var(--yellow-border); }
  .result-main.LOW { background: var(--green-bg); border-color: var(--green-border); }

  .result-emoji-bg { position: absolute; top: -10px; right: -10px; font-size: 72px; opacity: 0.1; }
  .result-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .result-name { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 3px; }
  .result-name-en { font-size: 12px; color: var(--text3); }
  .level-badge { border-radius: 20px; padding: 6px 13px; font-size: 12px; font-weight: 700; color: #fff; white-space: nowrap; flex-shrink: 0; }
  .level-badge.VERY_HIGH { background: var(--red); }
  .level-badge.HIGH { background: var(--orange); }
  .level-badge.MEDIUM { background: var(--yellow); }
  .level-badge.LOW { background: var(--green); }

  .purine-bar-wrap { margin-top: 14px; background: rgba(255,255,255,0.6); border-radius: 12px; padding: 12px 14px; }
  .purine-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .purine-mg { font-size: 18px; font-weight: 800; }
  .purine-mg.VERY_HIGH { color: var(--red); }
  .purine-mg.HIGH { color: var(--orange); }
  .purine-mg.MEDIUM { color: var(--yellow); }
  .purine-mg.LOW { color: var(--green); }
  .purine-label { font-size: 10px; color: var(--text3); }
  .bar-track { height: 6px; background: #E2E8F0; border-radius: 99px; overflow: hidden; flex: 1; }
  .bar-fill { height: 100%; border-radius: 99px; transition: width 0.6s ease; }
  .bar-fill.VERY_HIGH { background: var(--red); }
  .bar-fill.HIGH { background: var(--orange); }
  .bar-fill.MEDIUM { background: var(--yellow); }
  .bar-fill.LOW { background: var(--green); }
  .purine-desc { font-size: 12px; color: var(--text2); line-height: 1.5; }

  .card {
    background: var(--white); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .card-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 13px; }
  .card-title.blue { color: var(--primary); }
  .card-title.green { color: var(--green); }
  .card-title.pink { color: #C05B8A; }

  .tip-row { display: flex; gap: 9px; margin-bottom: 11px; align-items: flex-start; }
  .tip-row:last-child { margin-bottom: 0; }
  .tip-num { background: var(--primary-light); color: var(--primary); border-radius: 6px; width: 21px; height: 21px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 1px; }
  .tip-text { font-size: 13px; color: var(--text2); line-height: 1.65; }

  .advice-text { font-size: 13px; color: #2F855A; line-height: 1.7; }

  .similar-row {
    display: flex; align-items: center; justify-content: space-between;
    background: #F7FAFC; border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 13px; margin-bottom: 7px;
    cursor: pointer; transition: all 0.15s;
  }
  .similar-row:last-child { margin-bottom: 0; }
  .similar-row:hover { background: var(--primary-light); border-color: var(--primary); }
  .similar-name { font-size: 14px; color: var(--text); font-weight: 500; }
  .similar-right { display: flex; align-items: center; gap: 5px; }
  .similar-level { font-size: 12px; font-weight: 600; }
  .similar-level.VERY_HIGH { color: var(--red); }
  .similar-level.HIGH { color: var(--orange); }
  .similar-level.MEDIUM { color: var(--yellow); }
  .similar-level.LOW { color: var(--green); }

  .btn-reset {
    width: 100%; background: var(--white); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; color: var(--text3);
    font-size: 14px; font-family: inherit; cursor: pointer;
    box-shadow: var(--shadow); margin-top: 4px;
  }

  /* Not found */
  .not-found { text-align: center; padding: 40px 20px; }
  .not-found .emoji { font-size: 48px; margin-bottom: 12px; }
  .not-found p { font-size: 14px; color: var(--text3); line-height: 1.6; }
  .not-found strong { color: var(--text2); }

  /* Category browse */
  .food-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .food-grid-item {
    background: var(--white); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; box-shadow: var(--shadow); transition: all 0.15s;
  }
  .food-grid-item:hover { background: var(--primary-light); border-color: var(--primary); }
  .food-grid-name { font-size: 13px; color: var(--text); font-weight: 500; }
  .food-grid-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .food-grid-dot.VERY_HIGH { background: var(--red); }
  .food-grid-dot.HIGH { background: var(--orange); }
  .food-grid-dot.MEDIUM { background: var(--yellow); }
  .food-grid-dot.LOW { background: var(--green); }

  .count-badge { background: var(--primary-light); color: var(--primary); border-radius: 99px; padding: 2px 8px; font-size: 11px; font-weight: 700; margin-left: 6px; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <span style="font-size:24px">💧</span>
    <h1>요산 퓨린 체커</h1>
  </div>
  <p class="subtitle">음식명을 입력하면 퓨린 함량을 확인할 수 있어요</p>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="예: 삼겹살, 맥주, 시금치..." autocomplete="off" autocorrect="off">
    <button class="btn-search" onclick="doSearch()">검색</button>
  </div>
</header>

<div class="container">
  <div id="homeView">

// ── 유틸리티 ──
const LEVEL_INFO = {
  VERY_HIGH: {label:"매우 높음", color:"#E53E3E", emoji:"🚫", barPct:100, desc:"150mg/100g 이상 — 반드시 피하세요"},
  HIGH:      {label:"높음",     color:"#C05621", emoji:"⚠️",  barPct:70,  desc:"75~150mg/100g — 소량만, 자주 먹지 마세요"},
  MEDIUM:    {label:"보통",     color:"#975A16", emoji:"🟡", barPct:40,  desc:"30~75mg/100g — 적당량은 괜찮아요"},
  LOW:       {label:"낮음",     color:"#276749", emoji:"✅", barPct:15,  desc:"30mg/100g 미만 — 안심하고 드세요"},
};

const CATS = ["전체", "육류", "해산물", "채소", "콩류", "유제품", "음료", "과일", "곡류", "가공식품", "견과류", "간식"];
const QUICK = ["맥주","삼겹살","새우","멸치","두부","시금치","닭가슴살","계란","우유","커피","고등어","김치","삼계탕","된장찌개"];

let currentCat = "전체";

function normalize(s){ return s.replace(/\s/g,"").toLowerCase(); }

function findFood(q){
  const nq = normalize(q);
  let best = null, bestScore = 0;
  for(const f of DB){
    const names = [f.name, ...(f.aliases||[])];
    for(const n of names){
      const nn = normalize(n);
      if(nn === nq) return f; // exact
      if(nn.includes(nq) || nq.includes(nn)){
        const score = Math.min(nn.length, nq.length) / Math.max(nn.length, nq.length);
        if(score > bestScore){ bestScore = score; best = f; }
      }
    }
  }
  return bestScore > 0.4 ? best : null;
}

function showResult(food){
  const li = LEVEL_INFO[food.level];
  const rv = document.getElementById("resultView");
  const hv = document.getElementById("homeView");
  hv.style.display = "none";
  rv.style.display = "block";

  const similarHTML = food.similar.map(s => {
    const si = LEVEL_INFO[s.level];
    return `<div class="similar-row" onclick="searchFood('${s.name}')">
      <span class="similar-name">${s.name}</span>
      <div class="similar-right">
        <span>${si.emoji}</span>
        <span class="similar-level ${s.level}">${si.label}</span>
        <span style="font-size:11px;color:#CBD5E0">→</span>
      </div>
    </div>`;
  }).join("");

  const tipsHTML = food.tips.map((t,i) => `
    <div class="tip-row">
      <span class="tip-num">${i+1}</span>
      <span class="tip-text">${t}</span>
    </div>`).join("");

  rv.innerHTML = `<div class="result">
    <div class="result-main ${food.level}">
      <div class="result-emoji-bg">${li.emoji}</div>
      <div class="result-header">
        <div>
          <div class="result-name">${food.name}</div>
          ${food.aliases && food.aliases.length ? `<div class="result-name-en">${food.aliases[0]}</div>` : ""}
        </div>
        <span class="level-badge ${food.level}">${li.emoji} ${li.label}</span>
      </div>
      <div class="purine-bar-wrap">
        <div class="purine-row">
          <div>
            <div class="purine-mg ${food.level}">약 ${food.mg}mg</div>
            <div class="purine-label">/ 100g 기준</div>
          </div>
          <div class="bar-track">
            <div class="bar-fill ${food.level}" style="width:${li.barPct}%"></div>
          </div>
        </div>
        <div class="purine-desc">${li.desc}</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title blue">🍳 조리 & 섭취 유의사항</div>
      ${tipsHTML}
    </div>

    <div class="card" style="background:#F0FFF4;border-color:#C6F6D5">
      <div class="card-title green">💬 전문가 조언</div>
      <p class="advice-text">${food.advice}</p>
    </div>

    <div class="card">
      <div class="card-title pink">🔍 유사 음식 비교</div>
      ${similarHTML}
    </div>

    <button class="btn-reset" onclick="goHome()">← 홈으로 돌아가기</button>
  </div>`;

  // animate bar
  setTimeout(()=>{
    const bar = rv.querySelector(".bar-fill");
    if(bar){ bar.style.width = li.barPct + "%"; }
  }, 100);
}

function showNotFound(q){
  const rv = document.getElementById("resultView");
  const hv = document.getElementById("homeView");
  hv.style.display = "none";
  rv.style.display = "block";
  rv.innerHTML = `<div class="not-found">
    <div class="emoji">🔍</div>
    <p><strong>"${q}"</strong>에 대한 정보를 찾을 수 없어요.<br><br>
    다른 이름으로 검색해보세요.<br>
    예: "삼겹살" → "돼지고기", "새우볶음" → "새우"</p>
    <button class="btn-reset" style="margin-top:20px" onclick="goHome()">← 홈으로 돌아가기</button>
  </div>`;
}

function doSearch(){
  const q = document.getElementById("searchInput").value.trim();
  if(!q) return;
  const food = findFood(q);
  if(food) showResult(food);
  else showNotFound(q);
}

function searchFood(name){
  document.getElementById("searchInput").value = name;
  const food = findFood(name);
  if(food) showResult(food);
}

function goHome(){
  document.getElementById("homeView").style.display = "block";
  document.getElementById("resultView").style.display = "none";
  document.getElementById("searchInput").value = "";
  renderCat(currentCat);
}

function renderCat(cat){
  currentCat = cat;
  // update tabs
  document.querySelectorAll(".cat-tab").forEach(t => {
    t.classList.toggle("active", t.dataset.cat === cat);
  });
  // update grid
  const foods = cat === "전체"
    ? DB.slice().sort((a,b) => {
        const order = {VERY_HIGH:0, HIGH:1, MEDIUM:2, LOW:3};
        return order[a.level] - order[b.level];
      }).slice(0, 40)
    : DB.filter(f => f.cat === cat);

  const grid = document.getElementById("catGrid");
  grid.innerHTML = foods.map(f => {
    const li = LEVEL_INFO[f.level];
    return `<div class="food-grid-item" onclick="searchFood('${f.name}')">
      <span class="food-grid-name">${li.emoji} ${f.name}</span>
      <span class="food-grid-dot ${f.level}"></span>
    </div>`;
  }).join("");
}

// Init
window.onload = function(){
  // Quick tags
  const tagsEl = document.getElementById("quickTags");
  tagsEl.innerHTML = QUICK.map(t =>
    `<button class="tag" onclick="searchFood('${t}')">${t}</button>`
  ).join("");

  // Cat tabs
  const tabsEl = document.getElementById("catTabs");
  tabsEl.innerHTML = CATS.map(c => {
    const cnt = c === "전체" ? DB.length : DB.filter(f=>f.cat===c).length;
    return `<button class="cat-tab${c==="전체"?" active":""}" data-cat="${c}" onclick="renderCat('${c}')">${c}<span class="count-badge">${cnt}</span></button>`;
  }).join("");

  renderCat("전체");

  // Enter key
  document.getElementById("searchInput").addEventListener("keydown", e => {
    if(e.key === "Enter") doSearch();
  });
};
</script>
